<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="870" viewBox="0 0 2000 870" role="img" aria-labelledby="title desc">
<title id="title">A flexible workflow for human-robot coordination</title><desc id="desc">Opening, Alignment, Planning, Execution and Reflection, with example dialogue. Execution can return to alignment when circumstances change. Reflection returns to planning for a new agreement.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#176F73"/></marker></defs>
<rect width="2000" height="870" fill="#FFFFFF"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#183443">
<text x="42" y="45" font-size="22" font-weight="700" fill="#176F73" letter-spacing="2">SPEAK. SHOW. CLARIFY.</text>
<text x="42" y="82" font-size="25" font-weight="400" fill="#526773" >Speech and shared observations support every stage.</text>
<rect x="1530" y="18" width="170" height="40" rx="20" fill="#EAF1F8" stroke="none" stroke-width="2"/>
<text x="1550" y="45" font-size="19" font-weight="700" fill="#355D85" >HUMAN</text>
<rect x="1718" y="18" width="170" height="40" rx="20" fill="#EAF4F0" stroke="none" stroke-width="2"/>
<text x="1738" y="45" font-size="19" font-weight="700" fill="#266F52" >ROBOT</text>
<path d="M1387 196 V146 Q1387 134 1375 134 H619 Q607 134 607 146 V190" fill="none" stroke="#176F73" stroke-width="3" marker-end="url(#arrow)"/>
<text x="997" y="117" font-size="23" font-weight="600" fill="#176F73" text-anchor="middle">Changed circumstances? Clarify and agree again.</text>
<rect x="42" y="204" width="350" height="476" rx="18" fill="#FFFFFF" stroke="#D8E2E4" stroke-width="2"/>
<path d="M60 204 H368 L392 252 L368 300 H60 Q42 300 42 282 V222 Q42 204 60 204 Z" fill="#CB6228"/>
<text x="62" y="247" font-size="31" font-weight="700" fill="#FFFFFF" >1. Opening</text>
<text x="62" y="279" font-size="20" font-weight="400" fill="#FFFFFF" >Discover possibilities</text>
<path d="M400 252 H423" fill="none" stroke="#176F73" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="432" y="204" width="350" height="476" rx="18" fill="#FFFFFF" stroke="#D8E2E4" stroke-width="2"/>
<path d="M450 204 H758 L782 252 L758 300 H450 Q432 300 432 282 V222 Q432 204 450 204 Z" fill="#306D4C"/>
<text x="452" y="247" font-size="31" font-weight="700" fill="#FFFFFF" >2. Alignment</text>
<text x="452" y="279" font-size="20" font-weight="400" fill="#FFFFFF" >Clarify the task</text>
<path d="M790 252 H813" fill="none" stroke="#176F73" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="822" y="204" width="350" height="476" rx="18" fill="#FFFFFF" stroke="#D8E2E4" stroke-width="2"/>
<path d="M840 204 H1148 L1172 252 L1148 300 H840 Q822 300 822 282 V222 Q822 204 840 204 Z" fill="#17799E"/>
<text x="842" y="247" font-size="31" font-weight="700" fill="#FFFFFF" >3. Planning</text>
<text x="842" y="279" font-size="20" font-weight="400" fill="#FFFFFF" >Agree a plan</text>
<path d="M1180 252 H1203" fill="none" stroke="#176F73" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="1212" y="204" width="350" height="476" rx="18" fill="#FFFFFF" stroke="#D8E2E4" stroke-width="2"/>
<path d="M1230 204 H1538 L1562 252 L1538 300 H1230 Q1212 300 1212 282 V222 Q1212 204 1230 204 Z" fill="#874277"/>
<text x="1232" y="247" font-size="31" font-weight="700" fill="#FFFFFF" >4. Execution</text>
<text x="1232" y="279" font-size="20" font-weight="400" fill="#FFFFFF" >Coordinate while acting</text>
<path d="M1570 252 H1593" fill="none" stroke="#176F73" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="1602" y="204" width="350" height="476" rx="18" fill="#FFFFFF" stroke="#D8E2E4" stroke-width="2"/>
<path d="M1620 204 H1928 L1952 252 L1928 300 H1620 Q1602 300 1602 282 V222 Q1602 204 1620 204 Z" fill="#597B2C"/>
<text x="1622" y="247" font-size="31" font-weight="700" fill="#FFFFFF" >5. Reflection</text>
<text x="1622" y="279" font-size="20" font-weight="400" fill="#FFFFFF" >Improve the next run</text>
<rect x="58" y="320" width="318" height="116" rx="12" fill="#EAF1F8" stroke="none" stroke-width="2"/>
<text x="74" y="346" font-size="16" font-weight="700" fill="#355D85" letter-spacing="1.4">HUMAN</text>
<text x="74" y="379" font-size="25" font-weight="400" fill="#183443" >What are you?</text>
<text x="74" y="410" font-size="25" font-weight="400" fill="#183443" >What can you do?</text>
<rect x="58" y="448" width="318" height="116" rx="12" fill="#EAF1F8" stroke="none" stroke-width="2"/>
<text x="74" y="474" font-size="16" font-weight="700" fill="#355D85" letter-spacing="1.4">HUMAN</text>
<text x="74" y="507" font-size="25" font-weight="400" fill="#183443" >How can you make</text>
<text x="74" y="538" font-size="25" font-weight="400" fill="#183443" >yourself useful?</text>
<rect x="58" y="576" width="318" height="85" rx="12" fill="#EAF1F8" stroke="none" stroke-width="2"/>
<text x="74" y="602" font-size="16" font-weight="700" fill="#355D85" letter-spacing="1.4">HUMAN</text>
<text x="74" y="635" font-size="25" font-weight="400" fill="#183443" >How about you do ...?</text>
<rect x="448" y="320" width="318" height="116" rx="12" fill="#EAF1F8" stroke="none" stroke-width="2"/>
<text x="464" y="346" font-size="16" font-weight="700" fill="#355D85" letter-spacing="1.4">HUMAN</text>
<text x="464" y="379" font-size="25" font-weight="400" fill="#183443" >Are there questions</text>
<text x="464" y="410" font-size="25" font-weight="400" fill="#183443" >left unanswered?</text>
<rect x="448" y="448" width="318" height="116" rx="12" fill="#EAF1F8" stroke="none" stroke-width="2"/>
<text x="464" y="474" font-size="16" font-weight="700" fill="#355D85" letter-spacing="1.4">HUMAN</text>
<text x="464" y="507" font-size="25" font-weight="400" fill="#183443" >Are there decisions</text>
<text x="464" y="538" font-size="25" font-weight="400" fill="#183443" >I need to make?</text>
<text x="466" y="610" font-size="22" font-weight="400" fill="#526773" >The robot helps identify</text>
<text x="466" y="638" font-size="22" font-weight="400" fill="#526773" >what still needs deciding.</text>
<rect x="838" y="320" width="318" height="116" rx="12" fill="#EAF4F0" stroke="none" stroke-width="2"/>
<text x="854" y="346" font-size="16" font-weight="700" fill="#266F52" letter-spacing="1.4">ROBOT</text>
<text x="854" y="379" font-size="25" font-weight="400" fill="#183443" >Here is what I can do.</text>
<text x="854" y="410" font-size="25" font-weight="400" fill="#183443" >Is that what you want?</text>
<rect x="838" y="465" width="318" height="85" rx="12" fill="#EAF1F8" stroke="none" stroke-width="2"/>
<text x="854" y="491" font-size="16" font-weight="700" fill="#355D85" letter-spacing="1.4">HUMAN</text>
<text x="854" y="524" font-size="25" font-weight="400" fill="#183443" >Yes, start now.</text>
<rect x="850" y="587" width="294" height="57" rx="10" fill="#EAF4F0" stroke="none" stroke-width="2"/>
<text x="997" y="622" font-size="19" font-weight="700" fill="#266F52" text-anchor="middle" letter-spacing="1">EXPLICIT AGREEMENT</text>
<text x="1232" y="342" font-size="24" font-weight="600" fill="#183443" >Carry out the agreed task.</text>
<rect x="1228" y="374" width="318" height="116" rx="12" fill="#EAF1F8" stroke="none" stroke-width="2"/>
<text x="1244" y="400" font-size="16" font-weight="700" fill="#355D85" letter-spacing="1.4">HUMAN</text>
<text x="1244" y="433" font-size="25" font-weight="400" fill="#183443" >Wait - something</text>
<text x="1244" y="464" font-size="25" font-weight="400" fill="#183443" >has changed.</text>
<rect x="1228" y="512" width="318" height="116" rx="12" fill="#EAF4F0" stroke="none" stroke-width="2"/>
<text x="1244" y="538" font-size="16" font-weight="700" fill="#266F52" letter-spacing="1.4">ROBOT</text>
<text x="1244" y="571" font-size="25" font-weight="400" fill="#183443" >I need your help</text>
<text x="1244" y="602" font-size="25" font-weight="400" fill="#183443" >to continue.</text>
<rect x="1618" y="320" width="318" height="85" rx="12" fill="#EAF4F0" stroke="none" stroke-width="2"/>
<text x="1634" y="346" font-size="16" font-weight="700" fill="#266F52" letter-spacing="1.4">ROBOT</text>
<text x="1634" y="379" font-size="25" font-weight="400" fill="#183443" >Was that OK?</text>
<rect x="1618" y="434" width="318" height="116" rx="12" fill="#EAF4F0" stroke="none" stroke-width="2"/>
<text x="1634" y="460" font-size="16" font-weight="700" fill="#266F52" letter-spacing="1.4">ROBOT</text>
<text x="1634" y="493" font-size="25" font-weight="400" fill="#183443" >What should change</text>
<text x="1634" y="524" font-size="25" font-weight="400" fill="#183443" >next time?</text>
<text x="1636" y="606" font-size="22" font-weight="400" fill="#526773" >Review the outcome</text>
<text x="1636" y="634" font-size="22" font-weight="400" fill="#526773" >against the agreed goal.</text>
<path d="M1777 688 V740 Q1777 754 1763 754 H1011 Q997 754 997 740 V690" fill="none" stroke="#176F73" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1385" y="793" font-size="23" font-weight="600" fill="#176F73" text-anchor="middle">Agree changes before the next run.</text>
<text x="42" y="837" font-size="19" font-weight="400" fill="#526773" >Illustrative dialogue</text>
</g></svg>
