<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="430" viewBox="0 0 1460 430" role="img" aria-labelledby="title desc">
<title id="title">Flexible dialogue, explicit task control</title><desc id="desc">Generative dialogue interprets, proposes and explains. Explicit coordination state stores the agreement, phase and limits and governs execution. Outcomes and changed conditions feed back into coordination.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#176F73"/></marker></defs>
<rect width="1460" height="430" fill="#FFFFFF"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#183443">
<rect x="28" y="58" width="390" height="234" rx="18" fill="#EDF2F8" stroke="none" stroke-width="2"/>
<text x="52" y="108" font-size="30" font-weight="700" fill="#183443" >Generative dialogue</text>
<text x="52" y="146" font-size="16" font-weight="700" fill="#355D85" letter-spacing=".6">INTERPRET - PROPOSE - EXPLAIN</text>
<text x="52" y="205" font-size="27" font-weight="400" fill="#183443" >Speech and shared</text>
<text x="52" y="240" font-size="27" font-weight="400" fill="#183443" >observations</text>
<rect x="535" y="58" width="390" height="234" rx="18" fill="#EAF4F0" stroke="none" stroke-width="2"/>
<text x="559" y="108" font-size="30" font-weight="700" fill="#183443" >Coordination state</text>
<text x="559" y="146" font-size="16" font-weight="700" fill="#266F52" letter-spacing=".6">PRESERVE - CHECK - AUTHORISE</text>
<text x="559" y="205" font-size="27" font-weight="400" fill="#183443" >Agreement, phase,</text>
<text x="559" y="240" font-size="27" font-weight="400" fill="#183443" >roles and limits</text>
<rect x="1042" y="58" width="390" height="234" rx="18" fill="#F9EEE8" stroke="none" stroke-width="2"/>
<text x="1066" y="108" font-size="30" font-weight="700" fill="#183443" >Supported execution</text>
<text x="1066" y="146" font-size="16" font-weight="700" fill="#A6532A" letter-spacing=".6">ACT - OBSERVE - REPORT</text>
<text x="1066" y="205" font-size="27" font-weight="400" fill="#183443" >Speech and supported</text>
<text x="1066" y="240" font-size="27" font-weight="400" fill="#183443" >robot behaviours</text>
<text x="477" y="142" font-size="18" font-weight="600" fill="#176F73" text-anchor="middle">Proposal</text>
<path d="M430 173 H519" fill="none" stroke="#176F73" stroke-width="3" marker-end="url(#arrow)"/>
<text x="984" y="142" font-size="18" font-weight="600" fill="#176F73" text-anchor="middle">Permission</text>
<path d="M937 173 H1026" fill="none" stroke="#176F73" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1237 302 V348 Q1237 360 1225 360 H742 Q730 360 730 348 V305" fill="none" stroke="#176F73" stroke-width="3" marker-end="url(#arrow)"/>
<text x="984" y="396" font-size="23" font-weight="600" fill="#176F73" text-anchor="middle">Outcome or changed conditions</text>
<text x="29" y="395" font-size="19" font-weight="400" fill="#526773" >Simplified design principle</text>
</g></svg>
