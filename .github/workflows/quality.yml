name: quality

on:
  pull_request:
  push:
    branches:
      - main
      - features/designer

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Java and frontend regression suite
        run: ./mvnw --batch-mode --no-transfer-progress clean test
      - name: Designer mocked visual suite
        run: npm run test:designer:visual
      - name: Build runtime container
        run: docker build --tag prometheus:verification .
      - name: Upload designer browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: designer-browser-evidence
          path: test-results/designer-visual
          if-no-files-found: ignore
