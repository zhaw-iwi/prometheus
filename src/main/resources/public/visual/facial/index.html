<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prometheus Visual Facial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    @import url("/style.css");

    .video-shell {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: rgba(12, 22, 24, 0.08);
      aspect-ratio: 4 / 3;
    }

    #camera_video,
    #overlay_canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .metric-value {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .mono-log {
      background: #0b1316;
      color: #f7f3ea;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      height: 210px;
      overflow: auto;
      padding: 0.9rem;
      font-family: "Spline Sans Mono", "Cascadia Mono", ui-monospace, monospace;
      font-size: 0.83rem;
      line-height: 1.35;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <section class="page-shell py-4">
    <div class="container content-layer">
      <header class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-end mb-4 reveal">
        <div>
          <div id="agent_name" class="page-title">Prometheus Visual Facial</div>
          <div class="page-subtitle">Camera-based facial emotion observations.</div>
        </div>
        <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0">
          <button id="show_agent_info" class="btn btn-outline-ink btn-sm" type="button" title="Agent info">
            <i class="bi bi-info-circle"></i>
          </button>
          <span id="active_status" class="status-pill is-unknown">Unknown</span>
          <span id="camera_status" class="status-pill is-idle">Camera Idle</span>
        </div>
      </header>

      <div class="row g-4 justify-content-center">
        <div class="col-12 col-lg-7">
          <div class="card reveal delay-1">
            <div class="card-header">Camera Input</div>
            <div class="card-body">
              <div class="video-shell mb-3">
                <video id="camera_video" autoplay playsinline muted></video>
                <canvas id="overlay_canvas"></canvas>
              </div>
              <div class="d-flex gap-2 flex-wrap">
                <button id="start_camera" class="btn btn-primary" type="button">
                  <i class="bi bi-camera-video me-2"></i>Start Camera
                </button>
                <button id="stop_camera" class="btn btn-outline-ink" type="button" disabled>
                  <i class="bi bi-camera-video-off me-2"></i>Stop Camera
                </button>
                <button id="send_tick" class="btn btn-outline-ink" type="button" title="Trigger one no-input evaluation">
                  <i class="bi bi-clock-history me-2"></i>Trigger Tick
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-5">
          <div class="card reveal delay-2">
            <div class="card-header">Detection + Emission</div>
            <div class="card-body">
              <div class="row g-3">
                <div class="col-6">
                  <div class="metric-label">Detected Emotion</div>
                  <div id="emotion_name" class="metric-value">n/a</div>
                </div>
                <div class="col-6">
                  <div class="metric-label">Confidence</div>
                  <div id="emotion_confidence" class="metric-value">0.00</div>
                </div>
                <div class="col-6">
                  <div class="metric-label">Valence</div>
                  <div id="valence_value" class="metric-value">0.00</div>
                </div>
                <div class="col-6">
                  <div class="metric-label">Arousal</div>
                  <div id="arousal_value" class="metric-value">0.00</div>
                </div>
              </div>

              <hr />

              <div class="row g-2">
                <div class="col-6">
                  <label class="form-label metric-label" for="emit_interval_ms">Emit Interval (ms)</label>
                  <input id="emit_interval_ms" class="form-control form-control-sm" type="number" min="250" step="250" value="1000" />
                </div>
                <div class="col-6">
                  <label class="form-label metric-label" for="confidence_threshold">Confidence Threshold</label>
                  <input id="confidence_threshold" class="form-control form-control-sm" type="number" min="0" max="1" step="0.05" value="0.55" />
                </div>
                <div class="col-6">
                  <label class="form-label metric-label" for="change_threshold">Change Threshold</label>
                  <input id="change_threshold" class="form-control form-control-sm" type="number" min="0" max="1" step="0.02" value="0.08" />
                </div>
                <div class="col-6 d-flex align-items-end">
                  <div class="form-check">
                    <input id="emit_enabled" class="form-check-input" type="checkbox" checked />
                    <label class="form-check-label" for="emit_enabled">Emit Events</label>
                  </div>
                </div>
              </div>

              <div class="mt-3">
                <div class="metric-label">Activity Log</div>
                <div id="activity_log" class="mono-log"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
