<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prometheus Multilateral Listener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    @import url("/style.css");

    .transcript-log {
      display: grid;
      gap: 0.85rem;
      max-height: 48vh;
      overflow-y: auto;
      padding-right: 0.4rem;
    }

    .transcript-item {
      border: 1px solid var(--line);
      background: var(--surface-strong);
      border-radius: 14px;
      padding: 0.75rem 0.9rem;
      box-shadow: 0 10px 18px rgba(12, 22, 24, 0.08);
    }

    .transcript-meta {
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(12, 22, 24, 0.55);
      margin-bottom: 0.4rem;
    }

    #live_transcript {
      min-height: 2.5rem;
      font-size: 1.05rem;
      padding: 0.6rem 0.8rem;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.6);
      border: 1px dashed rgba(12, 22, 24, 0.2);
    }
  </style>
  <script type="module" src="script.js"></script>
</head>

<body>
  <section class="page-shell py-4">
    <div class="container content-layer">
      <header class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-end mb-4 reveal">
        <div>
          <div id="agent_name" class="page-title">Multilateral Listener</div>
          <div class="page-subtitle">Realtime transcription for multi-speaker sessions.</div>
        </div>
        <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0">
          <span id="listen_status" class="status-pill is-idle">Idle</span>
          <span class="status-pill">Multilateral</span>
        </div>
      </header>

      <div class="row justify-content-center">
        <div class="col-12 col-lg-8 col-xl-7">
          <div class="panel-rail">
            <div class="card reveal delay-1">
              <div class="card-header">Listening Controls</div>
              <div class="card-body">
                <div class="metric-label mb-2">Capture</div>
                <label class="form-label metric-label" for="access_code">Access code</label>
                <input id="access_code" class="form-control form-control-sm" type="password" autocomplete="off"
                  data-testid="listen-access-code" />
                <button id="toggle_listen" class="btn btn-primary w-100 my-3" type="button">
                  <i class="bi bi-mic-fill me-2"></i>Start Listening
                </button>
                <div class="metric-label">Status</div>
                <div class="small text-muted">Waiting for audio input.</div>
              </div>
            </div>

            <div class="card reveal delay-2">
              <div class="card-header">Live Transcription Settings</div>
              <div class="card-body">
                <div id="live_transcription_settings_root" data-testid="listen-transcription-settings">
                  <div class="small text-muted">Enter an access code to load settings.</div>
                </div>
                <button id="transcription_push_to_talk" class="btn btn-outline-ink w-100 mt-3 d-none"
                  type="button" aria-pressed="false" data-testid="listen-push-to-talk">
                  <i class="bi bi-mic-fill me-2"></i>Hold to Talk
                </button>
              </div>
            </div>

            <div class="card reveal delay-3">
              <div class="card-header">Transcription Feed</div>
              <div class="card-body">
                <div class="metric-label">Live Utterance</div>
                <div id="live_transcript" class="mb-3"></div>
                <div class="metric-label">Utterance Log</div>
                <div id="transcript_log" class="transcript-log">
                  <div id="transcript_empty" class="text-muted">No utterances yet.</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>

</html>
