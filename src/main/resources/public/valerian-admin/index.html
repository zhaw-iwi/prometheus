<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valerian Access Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <script>
    (() => {
      let theme = "light";
      try {
        theme = localStorage.getItem("prometheus.valerian.theme") === "dark" ? "dark" : "light";
      } catch (error) {
        theme = "light";
      }
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.bsTheme = theme;
    })();
  </script>
  <style>
    @import url("/style.css");

    :root {
      --admin-bg: #f6f7f4;
      --admin-panel: rgba(255, 255, 255, 0.94);
      --admin-soft: rgba(255, 255, 255, 0.72);
      --admin-muted: rgba(12, 22, 24, 0.62);
      --admin-line: rgba(12, 22, 24, 0.12);
      --admin-ok: #047857;
    }

    body {
      background: var(--admin-bg);
    }

    .page-shell::before,
    .page-shell::after {
      display: none;
    }

    .admin-layout {
      display: grid;
      grid-template-columns: minmax(290px, 0.8fr) minmax(430px, 1.25fr) minmax(320px, 0.95fr);
      gap: 1rem;
      align-items: start;
    }

    @media (max-width: 1199px) {
      .admin-layout {
        grid-template-columns: 1fr 1fr;
      }

      .assignment-column {
        grid-column: 1 / -1;
        order: 3;
      }
    }

    @media (max-width: 767px) {
      .admin-layout {
        grid-template-columns: 1fr;
      }
    }

    .admin-card {
      border-radius: 8px;
      background: var(--admin-panel);
      border: 1px solid var(--admin-line);
      box-shadow: 0 14px 30px rgba(12, 22, 24, 0.06);
      overflow: hidden;
    }

    .admin-card .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      background: rgba(255, 255, 255, 0.96);
      letter-spacing: 0;
    }

    .surface-panel {
      border: 1px solid var(--admin-line);
      border-radius: 8px;
      background: var(--admin-soft);
      padding: 0.85rem;
    }

    .admin-access-screen {
      min-height: calc(100vh - 2rem);
      display: grid;
      place-items: center;
    }

    .token-panel {
      width: min(100%, 430px);
    }

    .toolbar-button {
      width: 2.35rem;
      height: 2.35rem;
      display: inline-grid;
      place-items: center;
      padding: 0;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem;
      align-items: end;
    }

    .code-row {
      border: 1px solid var(--admin-line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.76);
      padding: 0.75rem;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.75rem;
      align-items: center;
    }

    .code-row.is-selected {
      border-color: rgba(0, 176, 162, 0.46);
      box-shadow: inset 3px 0 0 rgba(0, 176, 162, 0.68);
    }

    .code-list,
    .agent-type-list,
    .instance-list,
    .preset-entry-list {
      display: grid;
      gap: 0.55rem;
    }

    .agent-type-item,
    .instance-item {
      border: 1px solid var(--admin-line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.76);
      padding: 0.7rem;
    }

    .agent-package {
      border: 1px solid var(--admin-line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.62);
      overflow: hidden;
    }

    .agent-package-row {
      width: 100%;
      min-height: 2.65rem;
      border: 0;
      background: transparent;
      padding: 0.65rem 0.75rem;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 0.55rem;
      align-items: center;
      text-align: left;
    }

    .agent-package-row:hover {
      background: rgba(0, 176, 162, 0.06);
    }

    .agent-package-children {
      display: grid;
      gap: 0.5rem;
      padding: 0 0.65rem 0.65rem 1.1rem;
    }

    .agent-type-list>.agent-type-item {
      margin: 0;
    }

    .agent-package-children .agent-type-item {
      background: rgba(255, 255, 255, 0.82);
    }

    .preset-menu-wrap {
      position: relative;
    }

    .preset-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 0.35rem);
      z-index: 20;
      width: min(22rem, calc(100vw - 2rem));
      border: 1px solid var(--admin-line);
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 16px 32px rgba(12, 22, 24, 0.16);
      padding: 0.35rem;
    }

    .preset-menu-item {
      width: 100%;
      border: 0;
      border-radius: 6px;
      background: transparent;
      padding: 0.65rem 0.7rem;
      text-align: left;
    }

    .preset-menu-item:hover {
      background: rgba(0, 176, 162, 0.08);
    }

    .preset-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      background: rgba(12, 22, 24, 0.38);
      padding: 1rem;
    }

    .preset-modal {
      width: min(760px, 100%);
      max-height: min(720px, calc(100vh - 2rem));
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .preset-modal-body {
      overflow: auto;
    }

    .preset-entry {
      border: 1px solid var(--admin-line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.74);
      overflow: hidden;
    }

    .preset-entry summary {
      cursor: pointer;
      padding: 0.75rem;
      background: rgba(255, 255, 255, 0.9);
    }

    .preset-entry-body {
      display: grid;
      gap: 0.5rem;
      padding: 0 0.75rem 0.75rem 0.75rem;
    }

    .status-line {
      min-height: 1.35rem;
      color: var(--admin-muted);
      font-size: 0.88rem;
    }

    .status-line.is-error {
      color: #9f1239;
    }

    .status-line.is-success {
      color: var(--admin-ok);
    }

    .metric-label {
      color: var(--admin-muted);
    }

    .mono {
      font-family: "Spline Sans Mono", "Cascadia Mono", ui-monospace, monospace;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --ink: #f3f7f6;
      --paper: #11191c;
      --surface: rgba(18, 27, 30, 0.78);
      --surface-strong: rgba(24, 35, 39, 0.94);
      --line: rgba(226, 232, 240, 0.16);
      --admin-bg: #101719;
      --admin-panel: rgba(18, 27, 30, 0.94);
      --admin-soft: rgba(24, 35, 39, 0.78);
      --admin-muted: rgba(226, 232, 240, 0.68);
      --admin-line: rgba(226, 232, 240, 0.16);
      --admin-ok: #34d399;
      --bs-body-color: var(--ink);
      --bs-body-bg: var(--admin-bg);
      --bs-border-color: var(--admin-line);
      --bs-secondary-color: var(--admin-muted);
      --bs-emphasis-color: var(--ink);
      --bs-tertiary-bg: rgba(24, 35, 39, 0.92);
    }

    [data-theme="dark"] body {
      background:
        radial-gradient(circle at 15% 18%, rgba(255, 122, 0, 0.14), transparent 34%),
        radial-gradient(circle at 86% 10%, rgba(0, 176, 162, 0.16), transparent 32%),
        linear-gradient(135deg, #0e1517 0%, #121b1e 55%, #172225 100%);
    }

    [data-theme="dark"] .page-subtitle,
    [data-theme="dark"] .metric-label,
    [data-theme="dark"] .status-line {
      color: var(--admin-muted);
    }

    [data-theme="dark"] .admin-card,
    [data-theme="dark"] .surface-panel,
    [data-theme="dark"] .code-row,
    [data-theme="dark"] .agent-type-item,
    [data-theme="dark"] .instance-item,
    [data-theme="dark"] .agent-package,
    [data-theme="dark"] .agent-package-children .agent-type-item,
    [data-theme="dark"] .preset-menu,
    [data-theme="dark"] .preset-entry,
    [data-theme="dark"] .preset-entry summary {
      background: var(--admin-soft);
      border-color: var(--admin-line);
      color: var(--ink);
    }

    [data-theme="dark"] .admin-card .card-header,
    [data-theme="dark"] .card-header,
    [data-theme="dark"] .card-footer {
      background: var(--admin-panel);
      border-color: var(--admin-line);
      color: var(--ink);
    }

    [data-theme="dark"] .preset-menu {
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.38);
    }

    [data-theme="dark"] .agent-package-row,
    [data-theme="dark"] .preset-menu-item {
      color: var(--ink);
    }

    [data-theme="dark"] .agent-package-row:hover,
    [data-theme="dark"] .preset-menu-item:hover {
      background: rgba(0, 176, 162, 0.16);
    }

    [data-theme="dark"] .form-control,
    [data-theme="dark"] .form-select,
    [data-theme="dark"] .input-group-text {
      background-color: rgba(12, 19, 22, 0.92);
      border-color: var(--admin-line);
      color: var(--ink);
    }

    [data-theme="dark"] .form-control::placeholder {
      color: rgba(226, 232, 240, 0.48);
    }

    [data-theme="dark"] .btn-outline-ink {
      border-color: rgba(226, 232, 240, 0.36);
      color: var(--ink);
    }

    [data-theme="dark"] .btn-outline-ink:hover,
    [data-theme="dark"] .btn-outline-ink:focus-visible {
      background: rgba(226, 232, 240, 0.12);
      border-color: rgba(226, 232, 240, 0.56);
      color: var(--ink);
    }

    [data-theme="dark"] .status-pill {
      background: rgba(226, 232, 240, 0.08);
      border-color: rgba(226, 232, 240, 0.2);
      color: var(--ink);
    }

    [data-theme="dark"] .text-bg-light {
      background-color: rgba(226, 232, 240, 0.14) !important;
      color: var(--ink) !important;
    }
  </style>
</head>

<body>
  <section class="page-shell py-3">
    <div class="container-fluid content-layer px-3 px-xl-4">
      <section id="token_panel" class="admin-access-screen" data-testid="admin-token-panel">
        <div class="token-panel admin-card card">
          <div class="card-header">
            <span><i class="bi bi-shield-lock me-2"></i>Valerian Access Management</span>
            <button class="btn btn-outline-ink toolbar-button" type="button" title="Switch to dark mode"
              aria-label="Switch to dark mode" data-theme-toggle data-testid="admin-token-theme-toggle">
              <i class="bi bi-moon-stars"></i>
            </button>
          </div>
          <div class="card-body">
            <label class="form-label metric-label" for="admin_token_input">Admin Token</label>
            <div class="input-row">
              <input id="admin_token_input" class="form-control mono" type="password" autocomplete="current-password"
                data-testid="admin-token-input">
              <button id="submit_admin_token" class="btn btn-primary" type="button" data-testid="submit-admin-token">
                <i class="bi bi-box-arrow-in-right me-2"></i>Enter
              </button>
            </div>
            <div id="admin_token_status" class="status-line mt-2" data-testid="admin-token-status"></div>
          </div>
        </div>
      </section>

      <div id="admin_shell" class="d-none" data-testid="admin-shell" hidden>
        <header class="d-flex flex-column flex-xl-row justify-content-between align-items-xl-end gap-3 mb-3">
          <div>
            <div class="page-subtitle">Valerian Access Management</div>
          </div>
          <div class="d-flex flex-wrap align-items-center gap-2">
            <span id="admin_connection_state" class="status-pill is-unknown"
              data-testid="admin-connection-state">Admin Token Required</span>
            <button class="btn btn-outline-ink toolbar-button" type="button" title="Switch to dark mode"
              aria-label="Switch to dark mode" data-theme-toggle data-testid="admin-shell-theme-toggle">
              <i class="bi bi-moon-stars"></i>
            </button>
            <div class="preset-menu-wrap">
              <button id="access_code_preset_menu_button" class="btn btn-outline-ink toolbar-button" type="button"
                title="Access-code presets" aria-label="Access-code presets"
                data-testid="access-code-preset-menu-button">
                <i class="bi bi-lightning-charge"></i>
              </button>
              <div id="access_code_preset_menu" class="preset-menu" hidden
                data-testid="access-code-preset-menu"></div>
            </div>
            <button id="forget_admin_token" class="btn btn-outline-ink toolbar-button" type="button"
              title="Forget admin token" aria-label="Forget admin token" data-testid="forget-admin-token">
              <i class="bi bi-box-arrow-right"></i>
            </button>
          </div>
        </header>

      <main id="admin_workspace" class="admin-layout" data-testid="admin-workspace">
        <section class="admin-card card">
          <div class="card-header">
            <span><i class="bi bi-key me-2"></i>Access Codes</span>
            <button id="refresh_admin_data" class="btn btn-outline-ink btn-sm" type="button"
              data-testid="refresh-admin-data">
              <i class="bi bi-arrow-clockwise me-1"></i>Refresh
            </button>
          </div>
          <div class="card-body">
            <label class="form-label metric-label" for="new_access_code_input">New Access Code</label>
            <div class="input-group mb-2">
              <input id="new_access_code_input" class="form-control mono" type="text" maxlength="5" spellcheck="false"
                data-testid="new-access-code-input">
              <button id="generate_access_code" class="btn btn-outline-ink" type="button"
                data-testid="generate-access-code">
                <i class="bi bi-shuffle me-1"></i>Generate
              </button>
              <button id="create_access_code" class="btn btn-primary" type="button"
                data-testid="create-access-code">
                <i class="bi bi-plus-lg me-1"></i>Create
              </button>
            </div>
            <div id="access_code_create_status" class="status-line mb-3"
              data-testid="access-code-create-status"></div>
            <div id="access_code_list" class="code-list" data-testid="access-code-list"></div>
          </div>
        </section>

        <section class="admin-card card assignment-column">
          <div class="card-header">
            <span><i class="bi bi-diagram-3 me-2"></i>Agent Type Assignment</span>
            <span id="selected_code_label" class="metric-label mono" data-testid="selected-code-label">No code</span>
          </div>
          <div class="card-body">
            <div class="mb-3">
              <button id="save_agent_type_assignment" class="btn btn-primary w-100" type="button"
                data-testid="save-agent-type-assignment">
                <i class="bi bi-check2-circle me-1"></i>Save Assignments
              </button>
              <div id="assignment_status" class="status-line mt-2" data-testid="assignment-status"></div>
            </div>
            <label class="form-label metric-label" for="agent_type_filter">Filter Agent Types</label>
            <div class="input-group mb-3">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input id="agent_type_filter" class="form-control" type="search"
                placeholder="Search by package, name, or key" autocomplete="off"
                data-testid="admin-agent-type-filter">
            </div>
            <div id="agent_type_list" class="agent-type-list" data-testid="admin-agent-type-list"></div>
          </div>
        </section>

        <section class="admin-card card">
          <div class="card-header">
            <span><i class="bi bi-cpu me-2"></i>Instances</span>
            <button id="refresh_instances" class="btn btn-outline-ink btn-sm" type="button"
              data-testid="refresh-instances">
              <i class="bi bi-arrow-clockwise me-1"></i>Refresh
            </button>
          </div>
          <div class="card-body">
            <div id="instance_list" class="instance-list" data-testid="admin-instance-list"></div>
            <div id="instance_status" class="status-line mt-2" data-testid="instance-status"></div>
          </div>
        </section>
      </main>
      </div>
    </div>
  </section>

  <div id="access_code_preset_modal" class="preset-modal-backdrop d-none" hidden
    data-testid="access-code-preset-modal">
    <section class="preset-modal admin-card card" role="dialog" aria-modal="true"
      aria-labelledby="access_code_preset_modal_title">
      <div class="card-header">
        <span id="access_code_preset_modal_title"><i class="bi bi-lightning-charge me-2"></i>Access-Code Preset</span>
        <button id="close_access_code_preset_modal" class="btn btn-outline-ink toolbar-button" type="button"
          aria-label="Close preset modal" data-testid="close-access-code-preset-modal">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="card-body preset-modal-body">
        <div id="access_code_preset_entries" class="preset-entry-list"
          data-testid="access-code-preset-entries"></div>
      </div>
      <div class="card-footer bg-white">
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2">
          <div id="access_code_preset_status" class="status-line" data-testid="access-code-preset-status"></div>
          <div class="d-flex gap-2">
            <button id="cancel_access_code_preset" class="btn btn-outline-ink" type="button"
              data-testid="cancel-access-code-preset">Cancel</button>
            <button id="create_access_code_preset" class="btn btn-primary" type="button"
              data-testid="create-access-code-preset">
              <i class="bi bi-plus-lg me-1"></i>Create
            </button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>

</html>
