<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prometheus Nonverbal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    @import url("/style.css");

    .emoji-stage {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.82);
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(4rem, 8vw, 7rem);
      line-height: 1;
    }

    .gesture-label {
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(12, 22, 24, 0.7);
      font-weight: 600;
    }

    .speech-preview {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.9);
      padding: 0.75rem 0.9rem;
      min-height: 64px;
    }

    .mono-log {
      background: #0b1316;
      color: #f7f3ea;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      height: 220px;
      overflow: auto;
      padding: 0.9rem;
      font-family: "Spline Sans Mono", "Cascadia Mono", ui-monospace, monospace;
      font-size: 0.83rem;
      line-height: 1.35;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <section class="page-shell py-4">
    <div class="container content-layer">
      <header class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-end mb-4 reveal">
        <div>
          <div id="agent_name" class="page-title">Prometheus Nonverbal</div>
          <div class="page-subtitle">Gesture renderer from behaviour-plan events.</div>
        </div>
        <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0">
          <button id="show_agent_info" class="btn btn-outline-ink btn-sm" type="button" title="Agent info">
            <i class="bi bi-info-circle"></i>
          </button>
          <span id="active_status" class="status-pill is-unknown">Unknown</span>
          <span id="stream_status" class="status-pill is-idle">Stream Idle</span>
        </div>
      </header>

      <div class="row g-4 justify-content-center">
        <div class="col-12 col-lg-7">
          <div class="card reveal delay-1">
            <div class="card-header">Rendered Nonverbal Behaviour</div>
            <div class="card-body">
              <div id="gesture_emoji" class="emoji-stage">-</div>
              <div id="gesture_label" class="gesture-label mt-3">none</div>
              <div class="metric-label mt-3">Speech Preview</div>
              <div id="speech_preview" class="speech-preview">No behaviour event yet.</div>
            </div>
          </div>
        </div>
        <div class="col-12 col-lg-5">
          <div class="card reveal delay-2">
            <div class="card-header">Stream Controls</div>
            <div class="card-body">
              <div class="d-grid gap-2 mb-3">
                <button id="connect_stream" class="btn btn-primary" type="button">
                  <i class="bi bi-broadcast me-2"></i>Connect Stream
                </button>
                <button id="disconnect_stream" class="btn btn-outline-ink" type="button" disabled>
                  <i class="bi bi-plug me-2"></i>Disconnect Stream
                </button>
              </div>

              <div class="metric-label">Activity Log</div>
              <div id="activity_log" class="mono-log"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>

</html>
