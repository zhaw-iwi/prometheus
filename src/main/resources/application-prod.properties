# dbms and db connection data
spring.application.name=prometheus
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# log level
logging.level.ch.zhaw.prometheus=INFO
logging.level.org=ERROR
logging.level.com=ERROR

# tomcat server port
server.port=${PORT}

# continuous evaluation (Iteration 4)
prometheus.runtime.tick.enabled=false
prometheus.runtime.tick.delay-ms=1000

# Volatile background transition actions. Unfinished work is lost on restart.
prometheus.actions.parallelism=4
prometheus.actions.capacity=64
prometheus.actions.queue-timeout-ms=30000

# Eligible conversational behaviour overlaps transition decisions. No queued workers.
prometheus.behaviour.speculation.enabled=true
prometheus.behaviour.speculation.parallelism=2
prometheus.behaviour.speculation.capacity=64
prometheus.behaviour.speculation.ttl-ms=30000

# admin access-code management
prometheus.admin.token=${ADMIN_TOKEN}

# Experimental GPT-Live sessions (separate from live transcription).
# Uses OPENAI_KEY through openai-prod.properties. Enabled for this deployment;
# set PROMETHEUS_LIVE_ENABLED=false in Heroku config to disable it.
prometheus.live.enabled=true
prometheus.live.model=gpt-live-1
prometheus.live.sessions-url=https://api.openai.com/v1/live/sessions
prometheus.live.request-timeout-ms=15000
prometheus.live.close-timeout-ms=3000
prometheus.live.session-lifetime-seconds=900
prometheus.live.client-idle-seconds=30
prometheus.live.capacity=16

# cross-origin browser clients, for example an external Valerian cockpit
prometheus.cors.allowed-origins=http://127.0.0.1:5010,http://localhost:5010
prometheus.cors.allowed-origin-patterns=
