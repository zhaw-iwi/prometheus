# dbms and db connection data
spring.application.name=prometheus
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# tomcat server port
server.port=${PORT}

logging.level.com.mycompany.myapp=WARN
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

# continuous evaluation (Iteration 4)
prometheus.runtime.tick.enabled=false
prometheus.runtime.tick.delay-ms=1000

# admin access-code management
prometheus.admin.token=${ADMIN_TOKEN}

# cross-origin browser clients, for example an external Valerian cockpit
prometheus.cors.allowed-origins=http://127.0.0.1:5010,http://localhost:5010
prometheus.cors.allowed-origin-patterns=
